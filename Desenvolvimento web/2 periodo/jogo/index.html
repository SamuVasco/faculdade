<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- TIMER -->
    <div id="timer">Tempo: <span id="tempo">60</span></div>

    <!-- CONTADOR DE VIDAS -->
    <div id="vidas">Vidas: <span id="qtd-vidas">10</span></div>

    <!-- ITEM DE VIDA -->
    <div class="item-vida" id="vida1"></div>
    <div class="item-vida" id="vida2"></div>

    <!-- NUVEM -->
    <div class="nuvem"></div>


    <!-- PERSONAGEM -->
    <div class="personagem"></div>

    <!-- OBSTACULO -->
     <div class="obstaculo"></div>
    
    <!-- SOLO DO JOGO -->
    <div class="solo"></div>

    <!-- TELA DE GAME OVER (Inicialmente oculta) -->
    <div id="game-over-screen" class="game-over-screen">
        <div class="game-over-conteudo">
            <img src="imagens/gameover.png" alt="Game Over" class="game-over-img">
            <button class="btn-reiniciar" onclick="reiniciarJogo()">Jogar Novamente</button>
        </div>
    </div>

    <!-- TELA DE VITÓRIA (Parabéns) -->
    <div id="vitoria-screen" class="game-over-screen">
        <div class="game-over-conteudo">
            <img src="imagens/parabens.png" alt="Parabéns! Você sobreviveu!" class="game-over-img">
            <button class="btn-reiniciar" onclick="reiniciarJogo()">Jogar Novamente</button>
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
