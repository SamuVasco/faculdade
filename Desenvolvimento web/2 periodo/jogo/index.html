<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Sobrevivência</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Interface do jogo -->
    <div id="timer">Tempo: <span id="tempo">60</span></div>
    <div id="vidas">Vidas: <span id="qtd-vidas">10</span></div>

    <!-- Cenário -->
    <div class="nuvem"></div>
    <div class="solo"></div>

    <!-- Elementos do jogo -->
    <div class="item-vida" id="vida1"></div>
    <div class="personagem"></div>
    <div class="obstaculo"></div>

    <!-- Tela de derrota -->
    <div id="game-over-screen" class="game-over-screen">
        <div class="game-over-conteudo">
            <img src="imagens/gameover.png" alt="Game Over" class="game-over-img">
            <button type="button" class="btn-reiniciar">Jogar Novamente</button>
        </div>
    </div>

    <!-- Tela de vitória -->
    <div id="vitoria-screen" class="game-over-screen">
        <div class="game-over-conteudo">
            <img src="imagens/parabens.png" alt="Parabéns! Você sobreviveu!" class="game-over-img">
            <button type="button" class="btn-reiniciar">Jogar Novamente</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
